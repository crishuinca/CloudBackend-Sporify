spring.application.name=music-backend

# H2 en archivo: playlists y likes sobreviven al reinicio.
# Para PostgreSQL (EC2/RDS): SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=jdbc:h2:file:./data/sporify;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Azure Entra ID — resource server (valores públicos: tenant, audience, JWKS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/f0ec7247-e735-4fe5-9376-8bd06cc41a58/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/f0ec7247-e735-4fe5-9376-8bd06cc41a58/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audiences=api://0403d276-8c91-4a42-9f38-24f168ccc869,0403d276-8c91-4a42-9f38-24f168ccc869

sporify.cors.allowed-origins=${SPORIFY_CORS_ORIGINS:http://localhost:4200}

sporify.jamendo.base-url=https://api.jamendo.com/v3.0
sporify.jamendo.client-id=${JAMENDO_CLIENT_ID:70e89c62}


# RabbitMQ  — host EC2 o localhost

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Nombres centralizados (colas, exchanges, bindings, DLQ)
sporify.rabbit.direct-exchange=sporify.events.direct
sporify.rabbit.topic-exchange=sporify.events.topic
sporify.rabbit.dlx-exchange=sporify.dlx

sporify.rabbit.playlist-track-added-queue=sporify.playlist.track-added
sporify.rabbit.playlist-track-added-dlq=sporify.playlist.track-added.dlq
sporify.rabbit.playlist-track-added-routing-key=playlist.track.added

sporify.rabbit.likes-changed-queue=sporify.likes.changed
sporify.rabbit.likes-changed-dlq=sporify.likes.changed.dlq
sporify.rabbit.likes-changed-routing-key=likes.changed

sporify.rabbit.notifications-queue=sporify.notifications
sporify.rabbit.notifications-dlq=sporify.notifications.dlq
sporify.rabbit.notifications-routing-key=notify.user
