# Activa con: SPRING_PROFILES_ACTIVE=postgres
# En AWS usa DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sporify}
spring.datasource.username=${DATABASE_USERNAME:sporify}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.h2.console.enabled=false
