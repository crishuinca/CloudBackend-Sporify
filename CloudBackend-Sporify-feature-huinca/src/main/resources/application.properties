spring.application.name=music-backend

# H2 en archivo: playlists y likes sobreviven al reinicio.
# Para PostgreSQL (EC2/RDS): SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=jdbc:h2:file:./data/sporify;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Azure Entra ID — resource server (valores públicos: tenant, audience, JWKS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/5fecbe42-804f-4bcb-a026-b2849543f2b8/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/5fecbe42-804f-4bcb-a026-b2849543f2b8/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.audiences=api://artruo.onmicrosoft.com/sporify,abf036ca-559a-41f4-b879-fef157e84927

sporify.cors.allowed-origins=${SPORIFY_CORS_ORIGINS:http://localhost:4200}

sporify.jamendo.base-url=https://api.jamendo.com/v3.0
sporify.jamendo.client-id=${JAMENDO_CLIENT_ID:70e89c62}
